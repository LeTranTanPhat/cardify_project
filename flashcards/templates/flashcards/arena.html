{% extends 'flashcards/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/flashcard.css' %}">

<div class="levelup-banner" id="levelup-banner">⚡ LEVEL UP! ⚡</div>

<div class="arena-wrapper mt-3">
    <div class="text-center" data-aos="fade-down">
        <h2 class="fw-bold mb-1" style="color: #2d3436;">
            <i class="ph-duotone ph-sword text-warning"></i> {{ deck.title }}
        </h2>

        <div class="d-flex justify-content-between align-items-center mt-3 mb-2 px-2">
            <span class="text-muted fw-bold" id="progress-text">Thẻ: 1 / {{ cards.count }}</span>
            <span class="badge bg-danger text-white fs-6 shadow-sm rounded-pill py-2 px-3" id="heart-display">
                <i class="ph-fill ph-heart"></i> {{ user.profile.hearts }}
            </span>
        </div>

        <div class="scene">
            <div class="flashcard" id="myCard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-content" id="card-front-text">Đang tải...</div>
                    <div class="mt-4 text-muted small"><i class="ph-bold ph-mouse-simple"></i> CHẠM ĐỂ LẬT</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-content" id="card-back-text">Đang tải...</div>
                    <div class="mt-4 text-warning small fw-bold">BẠN CÓ NHỚ KHÔNG?</div>
                </div>
            </div>
        </div>

        <div class="controls mt-4" id="action-controls" style="display: none;">
            <div class="row g-3">
                <div class="col-6">
                    <button class="btn btn-outline-danger w-100 py-3 fw-bold rounded-4 shadow-sm" onclick="markCard(false)">
                        <i class="ph-bold ph-x-circle me-1"></i> QUÊN (-1 ❤️)
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-success w-100 py-3 fw-bold rounded-4 shadow-sm" onclick="markCard(true)">
                        <i class="ph-bold ph-check-circle me-1"></i> NHỚ (TIẾP)
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <a href="{% url 'dashboard' %}" class="text-decoration-none text-muted fw-bold small">
                <i class="ph-bold ph-house"></i> THOÁT VỀ TRANG CHỦ
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script>
    const deckCards = [
        {% for card in cards %}
            {
                id: "{{ card.id }}",
                front: "{{ card.front_side|escapejs }}",
                back: "{{ card.back_side|escapejs }}"
            },
        {% endfor %}
    ];

    let currentIndex = 0;
    let hearts = {{ user.profile.hearts|default:5 }};
    let correctAnswers = 0;

    const cardElement = document.getElementById('myCard');
    const frontText = document.getElementById('card-front-text');
    const backText = document.getElementById('card-back-text');
    const controls = document.getElementById('action-controls');
    const progressText = document.getElementById('progress-text');
    const heartDisplay = document.getElementById('heart-display');
    const navHeartsCount = document.getElementById('nav-hearts-count');

    /* ── Lật thẻ ── */
    function flipCard() {
        if (!cardElement.classList.contains('is-flipped')) {
            cardElement.classList.add('is-flipped');
            controls.style.display = 'block';
        }
    }

    /* ── Load thẻ ── */
    function loadCard() {
        if (currentIndex >= deckCards.length) {
            finishSession();
            return;
        }
        cardElement.classList.remove('is-flipped');
        controls.style.display = 'none';
        setTimeout(() => {
            frontText.innerText = deckCards[currentIndex].front;
            backText.innerText = deckCards[currentIndex].back;
            progressText.innerText = `Thẻ: ${currentIndex + 1} / ${deckCards.length}`;
        }, 150);
    }

    /* ── Lưu tiến độ ── */
    async function saveCardProgress(cardId, isRemembered) {
        try {
            await fetch('/api/record-interaction/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ card_id: cardId, is_remembered: isRemembered })
            });
        } catch (error) {
            console.error("Không thể lưu tiến độ thẻ:", error);
        }
    }

    /* ── Animation: Tim vỡ ── */
    function burstHeart() {
        const badge = document.getElementById('heart-display');
        const rect = badge.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const container = document.createElement('div');
        container.className = 'heart-burst-container';
        document.body.appendChild(container);

        const count = 6;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'heart-shard';
            el.textContent = '💔';
            const angle = (360 / count) * i + Math.random() * 30;
            const dist = 60 + Math.random() * 80;
            const dx = Math.cos(angle * Math.PI / 180) * dist;
            const dy = Math.sin(angle * Math.PI / 180) * dist;
            el.style.cssText = `
                left: ${cx}px;
                top: ${cy}px;
                --dx: ${dx}px;
                --dy: ${dy}px;
                --rot: ${-180 + Math.random() * 360}deg;
            `;
            container.appendChild(el);
        }

        setTimeout(() => container.remove(), 1000);
    }

    /* ── Animation: Bắn Pháo Hoa (Confetti) ── */
    function launchConfetti() {
        const duration = 2500; // Pháo hoa nổ trong 2.5 giây
        const end = Date.now() + duration;

        const defaults = { 
            startVelocity: 45, 
            spread: 90,        
            ticks: 80,         
            zIndex: 999999,    
            colors: ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFFFFF']
        };

        const interval = setInterval(function() {
            const timeLeft = end - Date.now();

            if (timeLeft <= 0) {
                return clearInterval(interval);
            }

            const particleCount = 40 * (timeLeft / duration);
            
            // Pháo bắn từ góc dưới bên trái
            confetti({
                ...defaults, 
                particleCount,
                angle: 60,
                origin: { x: 0, y: 1 } 
            });
            
            // Pháo bắn từ góc dưới bên phải
            confetti({
                ...defaults, 
                particleCount,
                angle: 120,
                origin: { x: 1, y: 1 } 
            });
        }, 250); 
    }

    /* ── Animation: Level Up ── */
    function showLevelUp() {
        const banner = document.getElementById('levelup-banner');
        if (banner) {
            banner.classList.remove('show');
            void banner.offsetWidth; 
            banner.classList.add('show');
            
            setTimeout(() => {
                banner.classList.remove('show');
            }, 2500);
        }
    }

    /* ── Đánh dấu thẻ ── */
    async function markCard(isRemembered) { 
        const currentCardId = deckCards[currentIndex].id;
        saveCardProgress(currentCardId, isRemembered);
    
        if (!isRemembered) {
            burstHeart();
            try {
                const response = await fetch('/reduce-heart/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });
                const data = await response.json();
                
                if (data.hearts !== undefined) {
                    hearts = data.hearts;
                    heartDisplay.innerHTML = `<i class="ph-fill ph-heart"></i> ${hearts}`;
                    if (navHeartsCount) navHeartsCount.innerText = `${hearts}/5`;
                    
                    if (hearts <= 0) {
                        showGameOver();
                        return;
                    }
                }
            } catch (e) {
                console.error("Lỗi giảm tim:", e);
            }
            
            currentIndex++;
            loadCard();
        } else {
            correctAnswers++;
    
            if (typeof gainXP === 'function') {
                const didLevelUp = await gainXP(15); 
                if (didLevelUp) {
                    showLevelUp(); 
                    launchConfetti(); // GỌI PHÁO HOA KHI LÊN CẤP Ở ĐÂY
                }
            }
    
            currentIndex++;
            loadCard();
        }
    }

    /* ── Kết thúc phiên ── */
    async function finishSession() {
        let totalXpGained = (correctAnswers * 15) + 50;
        if (typeof gainXP === 'function') gainXP(50);

        try {
            await fetch('/api/save-session/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    deck_id: "{{ deck.id }}",
                    cards_reviewed: deckCards.length,
                    correct_answers: correctAnswers,
                    xp_gained: totalXpGained
                })
            });
        } catch (error) {
            console.error("Lỗi khi lưu lịch sử:", error);
        }

        const accuracy = deckCards.length > 0
            ? Math.round((correctAnswers / deckCards.length) * 100)
            : 0;

        // Bắn pháo hoa ăn mừng học xong
        launchConfetti();

        // HIỆN BẢNG THÔNG BÁO HOÀN THÀNH (Đã được khôi phục)
        Swal.fire({
            title: '🎉 Hoàn thành phiên học!',
            html: `
                <div class="mt-2">
                    <p>Bạn đã xem hết <b>${deckCards.length}</b> thẻ.</p>
                    <p>Tỷ lệ nhớ: <span class="badge bg-success fs-6">${accuracy}%</span></p>
                    <p>XP nhận được: <span class="text-warning fw-bold">+${totalXpGained}</span></p>
                </div>
            `,
            icon: 'success',
            confirmButtonText: 'Xem lịch sử học tập',
            confirmButtonColor: '#27ae60'
        }).then(() => {
            // Lưu ý: Đảm bảo bạn đã có url 'study_history' trong urls.py của Django, 
            // Nếu chưa có, bạn có thể tạm đổi thành 'dashboard'
            window.location.href = "{% url 'study_history' %}"; 
        });
    }

    /* ── Game Over ── */
    function showGameOver() {
        Swal.fire({
            title: 'Hết máu rồi! 💔',
            text: 'Hãy nghỉ ngơi tại Trạm Pomodoro để hồi phục trí lực.',
            icon: 'warning',
            confirmButtonText: 'Về trang chủ',
            allowOutsideClick: false
        }).then(() => {
            window.location.href = "{% url 'dashboard' %}";
        });
    }

    loadCard();
</script>
{% endblock %}
