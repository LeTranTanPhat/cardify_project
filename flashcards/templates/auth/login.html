{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CARDIFY</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                <i class="ph-fill ph-lightning"></i>
            </div>
            <h1 class="auth-title">Chào mừng trở lại!</h1>
            <p class="auth-subtitle">Đăng nhập để tiếp tục học từ vựng</p>
        </div>

        {% if messages %}
            <div class="auth-messages mb-4">
                {% for message in messages %}
                    <div class="alert alert-danger d-flex align-items-center mb-0" role="alert" style="border-radius: 12px; font-weight: 500; font-size: 0.9rem; padding: 12px;">
                        <i class="ph-fill ph-warning-circle me-2" style="font-size: 1.3rem;"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}

            <div class="auth-form-group">
                <label class="auth-label">Tên đăng nhập</label>
                <i class="ph ph-user input-icon"></i>
                <input type="text" name="username" class="form-control auth-input" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="auth-form-group">
                <label class="auth-label">Mật khẩu</label>
                <i class="ph ph-lock-key input-icon"></i>
                
                <input type="password" name="password" id="passwordInput" class="form-control auth-input" placeholder="Nhập mật khẩu" required>
                
                <i class="ph ph-eye toggle-password" id="togglePassword"></i>
            </div>

            <button type="submit" class="auth-btn">
                Đăng nhập <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? 
            <a href="{% url 'register' %}" class="auth-link">Đăng ký ngay</a>
        </div>

    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

        togglePassword.addEventListener('click', function () {
            // Chuyển đổi loại input giữa 'password' và 'text'
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Đổi icon con mắt (eye <-> eye-slash)
            this.classList.toggle('ph-eye');
            this.classList.toggle('ph-eye-slash');
        });
    });
</script>
</body>
</html>
